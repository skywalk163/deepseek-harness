# FreeBSD counterpart of .github/workflows/ci.yml.
#
# Upstream ci.yml is built around GitHub-hosted enterprise runners, cache
# actions, Wine/Windows legs and failover pools — none of which apply to the
# FreeBSD host runner on this Gitea instance (fb5-freebsd, labels
# freebsd/freebsd-14.3/self-hosted, host mode, no Docker). This port keeps the
# signal that matters on FreeBSD: immutable install, a memory-bounded build of
# the host + client lib (then web), and the static gate aggregate. The host/
# client lib build runs SERIALLY under `cpuset` (half the cores) so its tsc -b
# outputs stay cacheable on the build host between runs instead of rebuilding
# 230+ packages from scratch each time. See the Build step for the OOM rationale.
#
# NOTE: the web build resolves workspace packages through their `exports` map,
# which points at built `lib/` output (e.g. @deepseek-ai/dsh-client-ui-theme/
# styles/* -> lib/styles/*). A fresh checkout has no lib/, so the full `build`
# command (which builds the client lib first) is REQUIRED before build:web.
# Splitting out only `build:lib:host` makes vite fail with ENOENT on
# lib/styles/base.css — this is exactly the upstream `ci-primary` ordering.
#
# Verified on this exact box: pnpm install --frozen-lockfile, pnpm run build and
# pnpm run check:ci:static all pass on FreeBSD 14.3 / Node 24 / pnpm 11.7.0.
#
# Unit tests (`pnpm test`) are intentionally a separate opt-in job: the full
# suite has ~60 FreeBSD-specific environment failures (e.g. @vscode/ripgrep
# ships no freebsd-x64 binary, fd-0 socket-vs-other PTY differences) that are
# platform drift, not regressions — see FREEBSD.md. Running them in the default
# gate would keep CI permanently red and drown the real signals above.

name: CI (FreeBSD)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Critical on the 8 GB / 4-core runner that ALSO hosts `dsh web`: two
  # overlapping CI runs (e.g. two quick pushes) stack their full `tsc -b`
  # builds and together blow past RAM -> kernel OOM-kill (exit 137). Cancelling
  # the in-progress run on a new push guarantees only ONE build runs at a time,
  # which is what keeps the build within the box's memory budget.
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'
  DSH_JAIL_RUN_BIN: /var/dsh-jail-run

jobs:
  node-24:
    runs-on: freebsd
    name: node 24 / build + static gates
    timeout-minutes: 90
    steps:
      # Always the local action repo — a bare `actions/checkout@v4` can
      # intermittently resolve to github.com and fail (docs/LOCAL_CI.md §6.4).
      - name: Checkout
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          node -v
          pnpm -v
          bash --version | head -1
          gmake --version | head -1

      # node-gyp compiles the node-pty native addon during install and invokes
      # GNU make under the name `make`; FreeBSD's /usr/bin/make is BSD make.
      # The runner's HOME is not the interactive user's, so recreate the shim.
      - name: GNU make shim
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          ln -sf /usr/local/bin/gmake "$HOME/bin/make"
          echo "PATH=$HOME/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Build cache: persist tsc -b outputs (lib/ + .tsbuildinfo) on the build
      # host so a fresh checkout still gets incremental rebuilds. tsc -b is
      # self-validating via .tsbuildinfo, so reusing across commits is safe; the
      # stamp (node/pnpm version + build-config hash) invalidates on toolchain or
      # build-script change. Without this every CI run rebuilds 230+ pkg lib from
      # scratch (~15-20 min); a HIT drops unchanged trees to seconds and — because
      # tsc -b then skips unchanged packages — also uses far less memory than a
      # full build (which is what makes the OOM below survivable on a MISS).
      - name: Restore build cache
        run: |
          set -eu
          CACHE_ROOT=/var/db/act_runner/ci-cache/dsh
          mkdir -p "$CACHE_ROOT"
          STAMP="node-$(node -v)-pnpm-$(pnpm -v)-$(cat tsconfig.host.json tsconfig.client.json tsdown.config.ts pnpm-lock.yaml | sha256 -q - 2>/dev/null || python3 -c 'import sys,hashlib;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          printf '%s' "$STAMP" > "$CACHE_ROOT/newstamp"
          if [ -f "$CACHE_ROOT/stamp" ] && [ "$(cat "$CACHE_ROOT/stamp")" = "$STAMP" ] && [ -f "$CACHE_ROOT/artifacts.tar.gz" ]; then
            echo "::notice::build cache HIT — restoring lib/ + .tsbuildinfo"
            tar -xzf "$CACHE_ROOT/artifacts.tar.gz"
          else
            echo "::notice::build cache MISS — clean build"
          fi

      - name: Build (memory-bounded host + client lib, then web)
        run: |
          set -eu
          # OOM root cause: the runner is an 8 GB / 4-core box that ALSO runs
          # `dsh web` (:3080). A default (all-core) `tsc -b` over the 230+ host
          # packages blows past RAM and the kernel OOM-killer SIGKILLs it
          # (exit 137). Two fixes:
          #   1. Pin the build to the first half of the cores via `cpuset`
          #      (usable by the non-root runner user). tsc -b's worker pool then
          #      holds ~half the in-flight programs -> ~half the peak heap.
          #   2. Build host + client lib SERIALLY (a previous parallel `&`/`wait`
          #      doubled peak memory and made OOM *more* likely).
          # The incremental cache above keeps HIT runs cheap and low-memory; this
          # only matters on a cache MISS. If a MISS still OOMs, the durable fix is
          # adding swap on the runner (e.g. `swapctl -a /swapfile`).
          NCPU=$(sysctl -n hw.ncpu)
          HALF=$(( NCPU / 2 ))
          [ "$HALF" -lt 1 ] && HALF=1
          MASK="0-$(( HALF - 1 ))"
          echo "::notice::building with 'cpuset -l $MASK' (half of $NCPU cores) to bound tsc memory"
          cpuset -l "$MASK" pnpm run build:lib:host
          cpuset -l "$MASK" pnpm run build:lib:client
          pnpm run build:web

      - name: Save build cache
        run: |
          set -eu
          CACHE_ROOT=/var/db/act_runner/ci-cache/dsh
          { find . -path '*/node_modules' -prune -o -name '*.tsbuildinfo' -print
            find . -type d -name lib -not -path '*/node_modules/*' -print; } > /tmp/dsh_cache_list.txt
          tar -czf "$CACHE_ROOT/artifacts.tar.gz" -T /tmp/dsh_cache_list.txt
          cp "$CACHE_ROOT/newstamp" "$CACHE_ROOT/stamp"
          echo "::notice::build cache SAVED"

      - name: Static gates (lint / typecheck / catalogs / docs)
        run: pnpm run check:ci:static

  unit-tests:
    runs-on: freebsd
    name: node 24 / unit tests (known FreeBSD drift, opt-in)
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          node -v
          pnpm -v

      - name: GNU make shim
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          ln -sf /usr/local/bin/gmake "$HOME/bin/make"
          echo "PATH=$HOME/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Full unit suite. Expect ~60 known FreeBSD platform failures today
      # (see FREEBSD.md); this job exists to track that drift, not to gate.
      - name: Unit tests (keyless)
        continue-on-error: true
        run: pnpm test
