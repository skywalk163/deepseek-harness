# FreeBSD counterpart of .github/workflows/e2e.yml — real DeepSeek API e2e.
#
# Same contract as upstream: consumes the DEEPSEEK_API_KEY_EXTERNAL repository
# secret, hits https://api.deepseek.com, and hard-fails the preflight if the
# key is missing (the e2e suites self-skip without a key, which would otherwise
# report a false green).
#
# Gitea specifics:
#   * runs-on: freebsd (host runner fb5-freebsd — labels freebsd/freebsd-14.3/self-hosted)
#   * checkout uses the local action repo (bare uses can intermittently resolve to github.com)
#   * no pnpm/action-setup or actions/setup-node — the host has node 24 + pnpm 11.7.0 in /usr/local/bin
#   * the bubblewrap install step is dropped — that is a Linux-only sandbox rung;
#     FreeBSD's confinement is jail(2) and is proven in sandbox.yml
#   * the job-level `if:` guards forks/dependabot like upstream

name: E2E (real DeepSeek API) — FreeBSD

# Only manual / scheduled runs. DEEPSEEK_API_KEY_EXTERNAL is a repository secret
# that is NOT wired into this self-hosted Gitea instance. Rather than hard-fail
# the preflight when it's absent (the upstream "fail loudly on a missing key"
# guard), this port skips the job cleanly with a notice — the real-API e2e is
# optional coverage, not part of the mandatory CI signal. Opt in via
# workflow_dispatch or the nightly schedule, and configure the secret if you want
# real-API coverage.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: freebsd
    name: e2e
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          node -v
          pnpm -v

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The real-API e2e needs DEEPSEEK_API_KEY_EXTERNAL (a Gitea repo secret
      # that is NOT wired into this self-hosted instance). Without it the suites
      # self-skip, so we don't hard-fail: we note it and skip the job cleanly.
      # Configure the repository secret if you want real-API coverage.
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::notice::DEEPSEEK_API_KEY_EXTERNAL is not configured — skipping real-API e2e (clean skip, not a pass)."
          else
            echo "DEEPSEEK_API_KEY present."
          fi

      - name: Build (lib for the e2e example bins)
        if: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL != '' }}
        run: pnpm run build

      - name: E2E tests (real DeepSeek API)
        if: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
